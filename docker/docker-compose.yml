networks:
  common:
    driver: bridge
services:

  #####################################################################################################################
  # OpenSearch
  #####################################################################################################################
  opensearch:
    # Use the command below to list available versions:
    # curl -s "https://registry.hub.docker.com/v2/repositories/opensearchproject/opensearch/tags/?page_size=100" | jq -r '.results[].name' | sort -r
    image: opensearchproject/opensearch:3.8.0
    container_name: home-ecosystem-opensearch
    environment:
      - TZ=${HOME_ECOSYSTEM_TIMEZONE:-UTC}
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${HOME_ECOSYSTEM_OPENSEARCH_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${HOME_ECOSYSTEM_VAR_DIR:-.var}/opensearch/data:/usr/share/opensearch/data:rw
    networks:
      - common
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: [ "CMD-SHELL", "curl -k -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"(green|yellow)\"'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  #####################################################################################################################
  # FluentBit
  #####################################################################################################################
  fluentbit:
    # Use the command below to list available versions:
    # curl -s "https://registry.hub.docker.com/v2/repositories/fluent/fluent-bit/tags/?page_size=100" | jq -r '.results[].name' | sort -r
    image: fluent/fluent-bit:4.2.8-debug
    container_name: home-ecosystem-fluentbit
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - TZ=${HOME_ECOSYSTEM_TIMEZONE:-UTC}
      - OPENSEARCH_PASSWORD=${HOME_ECOSYSTEM_OPENSEARCH_ADMIN_PASSWORD}
    volumes:
      - ${HOME_ECOSYSTEM_PROJECT_DIR:-.}/app/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ${HOME_ECOSYSTEM_PROJECT_DIR:-.}/app/fluentbit/scripts:/fluent-bit/etc/scripts:ro
    networks:
      - common
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:2020/api/v1/health | jq -e '.[\"fluent-bit\"].version != null and .[\"fluent-bit\"].edition != null' >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  #####################################################################################################################
  # OpenSearch Dashboards
  #####################################################################################################################
  opensearch-dashboards:
    # Use the command below to list available versions:
    # curl -s "https://registry.hub.docker.com/v2/repositories/opensearchproject/opensearch-dashboards/tags/?page_size=100" | jq -r '.results[].name' | sort -r
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: home-ecosystem-opensearch-dashboards
    depends_on:
      fluentbit:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      - TZ=${HOME_ECOSYSTEM_TIMEZONE:-UTC}
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${HOME_ECOSYSTEM_OPENSEARCH_ADMIN_PASSWORD}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5601:5601"
    networks:
      - common
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs -u \"$${OPENSEARCH_USERNAME}:$${OPENSEARCH_PASSWORD}\" http://localhost:5601/api/status | grep -Eq '\"state\"[[:space:]]*:[[:space:]]*\"green\"'" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  #####################################################################################################################
  # PostgreSQL database
  #####################################################################################################################
  postgres:
    # Use the command below to list available versions:
    # curl -s "https://registry.hub.docker.com/v2/repositories/library/postgres/tags/?page_size=100" | jq -r '.results[].name' |  sort -r
    image: postgres:17.9
    container_name: home-ecosystem-postgres
    depends_on:
      fluentbit:
        condition: service_healthy
    environment:
      - TZ=${HOME_ECOSYSTEM_TIMEZONE:-UTC}
      - POSTGRES_DB=${HOME_ECOSYSTEM_POSTGRES_DB_NAME:-postgres}
      - POSTGRES_USER=${HOME_ECOSYSTEM_POSTGRES_DB_USERNAME:-home_ecosystem}
      - POSTGRES_PASSWORD=${HOME_ECOSYSTEM_POSTGRES_DB_PASSWORD:-CHANGE ME!!!}
      - HOMEBOX_DB=${HOME_ECOSYSTEM_HOMEBOX_DB_NAME:-homebox}
      - HOMEBOX_USER=${HOME_ECOSYSTEM_HOMEBOX_DB_USERNAME:-homebox}
      - HOMEBOX_PASSWORD=${HOME_ECOSYSTEM_HOMEBOX_DB_PASSWORD:-CHANGE ME!!!}
    ports:
      - "5432:5432/tcp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${HOME_ECOSYSTEM_VAR_DIR:-.var}/postgres/data:/var/lib/postgresql/data:rw
      - ${HOME_ECOSYSTEM_TMP_DIR:-.tmp}/postgres-init:/docker-entrypoint-initdb.d:rw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - common
    restart: unless-stopped

  #####################################################################################################################
  # Homebox
  #####################################################################################################################
  homebox:
    # Use the command below to list available versions:
    # curl -s "https://registry.hub.docker.com/v2/repositories/sysadminsmedia/homebox/tags/?page_size=100" | jq -r '.results[].name' | sort -r
    image: sysadminsmedia/homebox:0.26.2
    container_name: home-ecosystem-homebox
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=${HOME_ECOSYSTEM_TIMEZONE:-UTC}
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_FILE_UPLOAD=10
      - HBOX_OPTIONS_ALLOW_ANALYTICS=${HOME_ECOSYSTEM_HOMEBOX_ALLOW_ANALYTICS:-false}
      - HBOX_AUTH_API_KEY_PEPPER=${HOME_ECOSYSTEM_HOMEBOX_API_KEY_PEPPER}
      - HBOX_DATABASE_DRIVER=postgres
      - HBOX_DATABASE_HOST=home-ecosystem-postgres
      - HBOX_DATABASE_PORT=5432
      - HBOX_DATABASE_DATABASE=${HOME_ECOSYSTEM_HOMEBOX_DB:-homebox}
      - HBOX_DATABASE_USERNAME=${HOME_ECOSYSTEM_HOMEBOX_USER:-homebox}
      - HBOX_DATABASE_PASSWORD=${HOME_ECOSYSTEM_HOMEBOX_DB_PASSWORD:-CHANGE ME!!!}
      - HBOX_DATABASE_SSL_MODE=disable
    ports:
      - "7745:7745/tcp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${HOME_ECOSYSTEM_VAR_DIR:-.var}/homebox/data:/data:rw
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:7745/api/v1/status | grep -Eq '\"health\"[[:space:]]*:[[:space:]]*true'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - common
    restart: unless-stopped

  #####################################################################################################################
  # Plex Media Server
  #####################################################################################################################
  plex:
    # Use the command below to list available versions:
    # curl -s "https://registry.hub.docker.com/v2/repositories/linuxserver/plex/tags/?page_size=100" | jq -r '.results[].name' | sort -r
    image: linuxserver/plex:1.43.3
    container_name: home-ecosystem-plex
    environment:
      - TZ=${HOME_ECOSYSTEM_TIMEZONE:-UTC}
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - PLEX_CLAIM=${HOME_ECOSYSTEM_PLEX_CLAIM:-}
    volumes:
      - ${HOME_ECOSYSTEM_VAR_DIR:-.var}/plex/config:/config:rw
      - ${HOME_ECOSYSTEM_VAR_DIR:-.var}/plex/transcode:/transcode:rw
      - ${HOME_ECOSYSTEM_PLEX_MEDIA_DIR:-.var/plex/media}:/external-media:ro
    networks:
      - common
    ports:
      - "32400:32400/tcp" # web UI
      - "3005:3005/tcp"   # plex companion
      - "8324:8324/tcp"   # roku discovery
      - "32469:32469/tcp" # DLNA
      - "1900:1900/udp"   # DLNA discovery
      - "32410:32410/udp" # GDM network discovery
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://127.0.0.1:32400/identity | grep -Eq '<MediaContainer .+version=\"[^\"]+\"'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  #####################################################################################################################
  # Nginx reverse proxy
  #####################################################################################################################
  nginx:
    # Use the command below to list available versions:
    # curl -s "https://registry.hub.docker.com/v2/repositories/library/nginx/tags/?page_size=100" | jq -r '.results[].name' | sort -r
    image: nginx:1.31.3
    container_name: home-ecosystem-nginx
    depends_on:
      homebox:
        condition: service_healthy
      plex:
        condition: service_healthy
      opensearch-dashboards:
        condition: service_healthy
    environment:
      - TZ=${HOME_ECOSYSTEM_TIMEZONE:-UTC}
    volumes:
      - ${HOME_ECOSYSTEM_PROJECT_DIR:-.}/app/homebox/nginx/homebox.conf:/etc/nginx/conf.d/homebox.conf:ro
      - ${HOME_ECOSYSTEM_PROJECT_DIR:-.}/app/homebox/nginx/customization:/usr/share/nginx/homebox-customization:ro
      - ${HOME_ECOSYSTEM_PROJECT_DIR:-.}/app/plex/nginx/plex.conf:/etc/nginx/conf.d/plex.conf:ro
      - ${HOME_ECOSYSTEM_PROJECT_DIR:-.}/app/opensearch/nginx/opensearch.conf:/etc/nginx/conf.d/opensearch.conf:ro
      - ${HOME_ECOSYSTEM_VAR_DIR:-.var}/nginx/logs:/var/log/nginx:rw
    networks:
      - common
    ports:
      - "80:80/tcp"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs -H 'Host: homebox.home.local' http://127.0.0.1/nginx-health | grep -qx 'ok'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
